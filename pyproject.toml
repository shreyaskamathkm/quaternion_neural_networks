[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quaternion_neural_networks"
version = "0.2.1"
description = "A short description of the project."
readme = "README.md"
authors = [{ name = "shreyaskamathkm@gmail.com"}]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only"
dependencies = [
    "pydantic>=2.11.7",
    "pyyaml>=6.0.1",
    "rich>=14.1.0",
    "click>=8.1.7",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scipy",
    ]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.3",
    "mypy>=1.13.0",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "types-PyYAML>=6.0.12.20240311",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pre-commit>=3.5.0",
    "bump-my-version>=0.16.0",
    "build>=1.0.0",
    "twine>=4.0.2",
]

[tool.setuptools.packages.find]
include = ["quaternion_neural_networks*"]
exclude = ["configs", "datasets", "artifacts", "notebooks", "tests", "docs"]


[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C", "B", "UP", "PT", "SIM", "RUF"
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = false
ignore_missing_imports = true

[tool.bumpversion]
current_version = "0.2.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "quaternion_neural_networks/__version__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
[tool.uv.sources]
torch = [
  { index = "pytorch-cu132", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cu132", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
